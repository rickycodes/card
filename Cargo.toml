[package]
name = "card"
version = "0.1.0"
license = "MIT"
authors = ["rickycodes <ricky.miller@gmail.com>"]
edition = "2018"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["native-cli"]
native-cli = ["dep:crossterm", "ratatui/crossterm"]

[[bin]]
name = "card"
path = "src/main.rs"
required-features = ["native-cli"]

[dependencies]
crossterm = { version = "0.28", optional = true }
ratatui = { version = "0.29", default-features = false }
